<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Copia Elit RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="/" class="logo">Copia <span>Elit</span></a>
        <nav class="nav" id="nav">
            <a href="/">Главная</a>
            <a href="/players.html">Игроки</a>
            <a href="/profile.html">Профиль</a>
            <a href="/admin.html" id="adminLink" style="display:none;">Админ</a>
            <a href="#" onclick="logout()">Выйти</a>
        </nav>
    </header>

    <main class="admin-panel">
        <h2>🔧 Админ-панель Copia Elit</h2>
        <div id="adminContent">
            <p style="text-align:center; color:#888;">Загрузка...</p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        (async function() {
            const user = getUser();
            if (!user || user.role !== 'admin') {
                alert('⛔ Доступ запрещён!');
                window.location.href = '/';
                return;
            }

            try {
                const response = await fetch(API_URL + '/users');
                const users = await response.json();

                const container = document.getElementById('adminContent');

                let html = `
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Пользователь</th>
                                <th>Персонаж</th>
                                <th>Роль</th>
                                <th>Баланс</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                users.forEach(u => {
                    html += `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td>${u.characterName || '—'}</td>
                            <td>${u.role}</td>
                            <td>
                                <input type="number" value="${u.balance}" id="balance_${u.id}" style="width:60px;padding:4px;background:#1a1a2e;color:#fff;border:1px solid #333;border-radius:4px;">
                            </td>
                            <td class="actions">
                                <button class="promote" onclick="promoteUser('${u.id}')">👑</button>
                                <button class="delete" onclick="deleteUser('${u.id}')">🗑</button>
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;

                window.promoteUser = async function(userId) {
                    const newRole = prompt('Введите роль (user/admin):');
                    if (!newRole) return;
                    if (newRole !== 'user' && newRole !== 'admin') {
                        alert('Только user или admin');
                        return;
                    }
                    await fetch('/api/admin/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, field: 'role', value: newRole })
                    });
                    location.reload();
                };

                window.deleteUser = async function(userId) {
                    if (!confirm('Удалить пользователя?')) return;
                    await fetch('/api/admin/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId })
                    });
                    location.reload();
                };

                // Сохранение баланса
                document.querySelectorAll('[id^="balance_"]').forEach(input => {
                    input.addEventListener('change', async function() {
                        const userId = this.id.replace('balance_', '');
                        const value = this.value;
                        await fetch('/api/admin/update', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId, field: 'balance', value })
                        });
                        alert('Баланс обновлён!');
                    });
                });

            } catch (error) {
                console.error(error);
                document.getElementById('adminContent').innerHTML = '<p style="color:#ff2d55;">Ошибка загрузки</p>';
            }
        })();
    </script>
</body>
</html>
