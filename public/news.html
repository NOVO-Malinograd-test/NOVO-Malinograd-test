<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — Copia Elit RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="/" class="logo">Copia <span>Elit</span></a>
        <nav class="nav" id="nav">
            <a href="/">Главная</a>
            <a href="/players.html">Игроки</a>
            <a href="/chat.html">Чат</a>
            <a href="/shop.html">Магазин</a>
            <a href="/news.html">Новости</a>
            <a href="/profile.html">Профиль</a>
            <a href="/admin.html" id="adminLink" style="display:none;">Админ</a>
            <a href="#" onclick="logout()">Выйти</a>
        </nav>
    </header>

    <main class="news-section">
        <h2>📰 Новости Copia Elit</h2>
        <div id="newsContainer">
            <p style="color:#888; text-align:center;">Загрузка новостей...</p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        async function loadNews() {
            try {
                const res = await fetch(API_URL + '/news');
                const news = await res.json();

                const container = document.getElementById('newsContainer');
                container.innerHTML = '';

                if (news.length === 0) {
                    container.innerHTML = '<p style="color:#888; text-align:center;">Новостей пока нет</p>';
                    return;
                }

                news.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <h3>${item.title}</h3>
                        <div class="meta">📅 ${new Date(item.createdAt).toLocaleDateString()} ✍️ ${item.author || 'Админ'}</div>
                        <p>${item.content}</p>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('newsContainer').innerHTML = '<p style="color:#ff2d55; text-align:center;">Ошибка загрузки новостей</p>';
            }
        }

        loadNews();
        setInterval(loadNews, 30000);
    </script>
</body>
</html>
