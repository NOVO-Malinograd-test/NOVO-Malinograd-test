<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игроки — Copia Elit RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="/" class="logo">Copia <span>Elit</span></a>
        <nav class="nav" id="nav">
            <a href="/">Главная</a>
            <a href="/players.html">Игроки</a>
            <a href="/chat.html">Чат</a>
            <a href="/shop.html">Магазин</a>
            <a href="/news.html">Новости</a>
            <a href="/profile.html">Профиль</a>
            <a href="/admin.html" id="adminLink" style="display:none;">Админ</a>
            <a href="#" onclick="logout()">Выйти</a>
        </nav>
    </header>

    <main style="max-width:1200px; margin:40px auto; padding:0 20px;">
        <h2 style="font-size:32px; margin-bottom:20px; color:#ff2d55;">👥 Все игроки Copia Elit</h2>
        <div class="players-grid" id="playersGrid"></div>
    </main>

    <script src="script.js"></script>
    <script>
        (async function() {
            try {
                const response = await fetch(API_URL + '/users');
                const users = await response.json();

                const grid = document.getElementById('playersGrid');
                grid.innerHTML = '';

                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                        <img src="${user.avatar || '/uploads/default.png'}" alt="${user.username}">
                        <h4>${user.username} ${user.vip ? '👑' : ''}</h4>
                        <p>🎭 ${user.characterName || 'Без персонажа'}</p>
                        <p>💰 ${user.balance}</p>
                        <p style="font-size:11px; color:#666;">${user.role === 'admin' ? '👑 Админ' : '🎭 Игрок'}</p>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
            }
        })();
    </script>
</body>
</html>
