<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин — Copia Elit RP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="/" class="logo">Copia <span>Elit</span></a>
        <nav class="nav" id="nav">
            <a href="/">Главная</a>
            <a href="/players.html">Игроки</a>
            <a href="/chat.html">Чат</a>
            <a href="/shop.html">Магазин</a>
            <a href="/news.html">Новости</a>
            <a href="/profile.html">Профиль</a>
            <a href="/admin.html" id="adminLink" style="display:none;">Админ</a>
            <a href="#" onclick="logout()">Выйти</a>
        </nav>
    </header>

    <main style="max-width:1200px; margin:40px auto; padding:0 20px;">
        <h2 style="font-size:32px; margin-bottom:20px; color:#ff2d55;">🛒 Магазин</h2>
        <div class="shop-grid" id="shopGrid"></div>
    </main>

    <script src="script.js"></script>
    <script>
        async function loadShop() {
            try {
                const res = await fetch(API_URL + '/shop');
                const items = await res.json();

                const grid = document.getElementById('shopGrid');
                grid.innerHTML = '';

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'shop-item';
                    div.innerHTML = `
                        <h4>${item.name}</h4>
                        <div class="price">💰 ${item.price}</div>
                        <div class="desc">${item.description}</div>
                        <button class="buy-btn" onclick="buyItem('${item.id}')">Купить</button>
                    `;
                    grid.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function buyItem(itemId) {
            const user = getUser();
            if (!user) {
                alert('Войдите в аккаунт!');
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(API_URL + '/shop/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: user.id, itemId })
                });

                const data = await res.json();
                if (data.success) {
                    alert('✅ Покупка успешна! Новый баланс: ' + data.newBalance);
                    if (data.vip) {
                        user.vip = true;
                        localStorage.setItem('user', JSON.stringify(user));
                    }
                    loadShop();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                console.error(error);
            }
        }

        loadShop();
    </script>
</body>
</html>
